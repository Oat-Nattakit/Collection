<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --border: #e3e3e0; --accent: #3b6fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --surface: #1e1e21; --text: #ececee; --muted: #9a9aa2;
            --border: #2e2e33; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; }
  a { color: inherit; text-decoration: none; }
  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar input { width: 220px; max-width: 45vw; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
               background: var(--surface); color: var(--text); font: inherit; }
  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
         color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn[aria-disabled="true"] { opacity: .35; pointer-events: none; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }

  /* Index grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
          transition: transform .15s, border-color .15s; display: flex; flex-direction: column; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .thumb { aspect-ratio: 3 / 4; background: var(--border); }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .info { padding: 10px 12px; }
  .card .no { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; }
  .card .name { font-weight: 600; line-height: 1.3; margin: 2px 0 4px; }
  .card .count { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }

  /* Reader */
  .reader { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .reader img { width: 100%; height: auto; display: block; background: var(--border); min-height: 200px; }
  .reader img.loaded { min-height: 0; }
  .pager { display: flex; justify-content: space-between; gap: 12px; max-width: 900px; margin: 24px auto 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 auto 14px; max-width: 900px; }
  .toTop { position: fixed; right: 16px; bottom: 16px; }
</style>
</head>
<body>
<header><div class="bar" id="bar"></div></header>
<main id="main"></main>

<script src="data.js"></script>
<script>
const RES = '../Resource/';
const data = (window.COLLECTION || []).map(x => {
  const m = x.folder.match(/^(\d+)[_\-\s]*(.*)$/);
  return {
    folder: x.folder,
    no: m ? m[1] : '',
    title: (m ? m[2] : x.folder).replace(/_/g, ' ') || x.folder,
    images: [].concat(x.images || []).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
  };
}).sort((a, b) => a.folder.localeCompare(b.folder, undefined, { numeric: true }));

const $bar = document.getElementById('bar');
const $main = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const src = (folder, file) => RES + encodeURIComponent(folder) + '/' + encodeURIComponent(file);
let query = '';

function renderIndex() {
  document.title = 'Collection';
  $bar.innerHTML = `<h1>Collection <span style="color:var(--muted);font-weight:400">(${data.length})</span></h1>
    <input id="q" type="search" placeholder="ค้นหา..." value="${esc(query)}">`;
  const q = document.getElementById('q');
  q.addEventListener('input', () => { query = q.value; drawGrid(); });
  drawGrid();
  window.scrollTo(0, 0);
}

function drawGrid() {
  const q = query.trim().toLowerCase();
  const list = data.filter(d => !q || d.folder.toLowerCase().includes(q) || d.title.toLowerCase().includes(q));
  if (!data.length) {
    $main.innerHTML = `<div class="empty">ไม่พบข้อมูล — ดับเบิลคลิก <b>generate.bat</b> เพื่อสร้าง data.js จากโฟลเดอร์ Resource</div>`;
    return;
  }
  if (!list.length) { $main.innerHTML = `<div class="empty">ไม่พบรายการที่ค้นหา</div>`; return; }
  $main.innerHTML = `<div class="grid">${list.map(d => `
    <a class="card" href="#/${encodeURIComponent(d.folder)}">
      <div class="thumb">${d.images[0] ? `<img loading="lazy" src="${esc(src(d.folder, d.images[0]))}" alt="">` : ''}</div>
      <div class="info">
        <div class="no">#${esc(d.no)}</div>
        <div class="name">${esc(d.title)}</div>
        <div class="count">${d.images.length} รูป</div>
      </div>
    </a>`).join('')}</div>`;
}

function renderReader(folder) {
  const i = data.findIndex(d => d.folder === folder);
  if (i < 0) { location.hash = ''; return; }
  const d = data[i], prev = data[i - 1], next = data[i + 1];
  document.title = `${d.no} ${d.title}`;
  const link = (x, label) => `<a class="btn" href="${x ? '#/' + encodeURIComponent(x.folder) : '#'}" aria-disabled="${!x}">${label}</a>`;
  $bar.innerHTML = `<a class="btn" href="#">← หน้าหลัก</a><h1>#${esc(d.no)} ${esc(d.title)}</h1>
    ${link(prev, '‹ ก่อนหน้า')}${link(next, 'ถัดไป ›')}`;
  $main.innerHTML = `
    <div class="meta">${d.images.length} รูป · ${esc(d.folder)}</div>
    <div class="reader">${d.images.map((f, n) =>
      `<img loading="${n < 3 ? 'eager' : 'lazy'}" src="${esc(src(d.folder, f))}" alt="${esc(f)}" onload="this.classList.add('loaded')">`).join('')}</div>
    <div class="pager">${link(prev, '‹ ' + (prev ? esc(prev.title) : 'ก่อนหน้า'))}${link(next, (next ? esc(next.title) : 'ถัดไป') + ' ›')}</div>
    <button class="btn toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>`;
  window.scrollTo(0, 0);
}

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  h ? renderReader(h) : renderIndex();
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !location.hash.replace(/^#\/?/, '')) return;
  const btns = [...$bar.querySelectorAll('a.btn')];
  if (e.key === 'ArrowLeft' && btns[1]?.getAttribute('aria-disabled') === 'false') btns[1].click();
  if (e.key === 'ArrowRight' && btns[2]?.getAttribute('aria-disabled') === 'false') btns[2].click();
});
route();
</script>
</body>
</html>
