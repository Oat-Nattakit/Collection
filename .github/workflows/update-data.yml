# Regenerate Page/data.js automatically whenever Resource/ changes,
# so folders uploaded from GitHub web/mobile show up without running generate.bat.
name: Update data.js

on:
  push:
    branches: [main]
    paths: ['Resource/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate data.js
        shell: pwsh
        run: ./Page/generate.ps1
      - name: Commit if changed
        run: |
          if git diff --quiet -- Page/data.js; then
            echo "data.js unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Page/data.js
          git commit -m "[Auto] Update data.js"
          git push
